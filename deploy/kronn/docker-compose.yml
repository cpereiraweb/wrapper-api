# wrapper-api na Kronn: app "nfe-api", servidor Docker sem Swarm.
#
# Cole no painel da Kronn como compose da app, modo IMAGEM. O passo a passo
# está em deploy/kronn/README.md. Como o arquivo já traz os labels do Traefik,
# a Kronn o usa como está: o deploy é "docker compose down" seguido de
# "docker compose up -d --force-recreate".
#
# - A chave do primeiro serviço é o slug da app (nfe-api). É por esse nome que a
#   Kronn acha o container principal, e o deploy falha se ele não estiver de pé.
# - São dois serviços da mesma imagem. O worker carrega a lib fiscal nativa, que
#   pode morrer com SIGSEGV; isolado, leva só a requisição em curso. A API fala
#   com ele por um socket unix no volume worker-run, que o compose declara:
#   não cadastre volume pelo painel, que o criaria só para a API.
# - A API só sobe com o worker saudável (depends_on), senão ela responderia 503
#   no /readyz enquanto a lib carrega.
# - stop_grace_period de 75s nos dois: o shutdown espera até 60s por uma
#   transmissão em curso. Cortar antes deixa documento em desfecho indeterminado.
# - container_name nos dois: sem ele, a Kronn remove os containers pelo nome do
#   serviço, e "worker" pegaria qualquer container do host com esse nome.
# - O worker fica fora da kronn-network: não recebe tráfego, e a rede padrão do
#   projeto já dá a saída para a internet que ele precisa para falar com o fisco.
# - Variáveis vêm do .env do painel, lido pelos dois serviços. Nenhum segredo
#   neste arquivo.
services:
  nfe-api:
    image: 'ghcr.io/cpereiraweb/wrapper-api/api:latest'
    container_name: kronn-app-nfe-api
    env_file:
      - .env
    environment:
      ACBR_WORKERS: /run/wrapper/fiscal.sock
    expose:
      - 8080
    networks:
      - kronn-network
    volumes:
      - worker-run:/run/wrapper
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 75s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.nfe-api.rule=Host(`nfe.datasapiens.ia.br`)
      - traefik.http.routers.nfe-api.entrypoints=websecure
      - traefik.http.routers.nfe-api.tls=true
      - traefik.http.routers.nfe-api.tls.certresolver=letsencrypt
      - traefik.http.services.nfe-api.loadbalancer.server.port=8080

  worker:
    image: 'ghcr.io/cpereiraweb/wrapper-api/api:latest'
    container_name: kronn-app-nfe-api-worker
    command: ["worker"]
    env_file:
      - .env
    environment:
      ACBR_WORKER_LISTEN: /run/wrapper/fiscal.sock
    volumes:
      - worker-run:/run/wrapper
    # O healthcheck da imagem testa a porta 8080, que o worker não abre.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--unix-socket", "/run/wrapper/fiscal.sock", "http://worker/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 75s
    restart: unless-stopped

networks:
  kronn-network:
    external: true

volumes:
  worker-run:
