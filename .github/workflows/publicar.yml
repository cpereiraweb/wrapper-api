name: Publicar imagem

# Builda e publica a imagem no GHCR, taggeada com o SHA. Depois do teste de
# fumaça, o MESMO digest vira :latest e, se o secret KRONN_DEPLOY_HOOK existir,
# a Kronn é chamada para reimplantar. Sem o secret, publica e para aí. Quem
# promove para :vX.Y.Z continua sendo o release.
#
# Não tem gatilho próprio: quem chama é o job "publicar" do ci.yml, em push na
# main, e só depois de todos os gates passarem. Com gatilho de push próprio ele
# rodava em paralelo com o CI, e um commit reprovado nos testes chegava à
# produção do mesmo jeito. Para republicar, re-execute o CI daquele commit.
on:
  workflow_call:
    secrets:
      KRONN_DEPLOY_HOOK:
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository }}/api

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A imagem precisa dos .so, que não estão no repositório: vêm dos anexos de
      # release. Como o repositório é público, o download é sem token.
      - name: baixa as libs nativas
        run: make acbr-libs-baixar

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # a ACBrLib só existe para x86_64
          push: true
          # Só o :sha aqui. O :latest anda depois da fumaça: publicá-lo junto,
          # antes do teste, deixaria uma imagem que não sobe à disposição de
          # qualquer redeploy que puxe :latest.
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prova que a imagem sobe e que a lib nativa carrega de verdade, antes de
      # alguém puxá-la. Uma imagem que publica e não sobe é pior que build falho.
      - name: "fumaça: a lib carrega e o serviço responde"
        run: |
          set -eu
          # Nomes de container precisam de 2+ caracteres: o daemon recusa "w" e
          # "a" com "Invalid container name". Não encurte.
          docker network create fumaca
          # Volume NOMEADO, como no compose. Bind mount de diretório do host não
          # serve: ele nasce do root, e a imagem roda como app (uid 10001), então
          # o worker leva "permission denied" ao criar o socket. Um volume nomeado
          # herda a dona do /run/wrapper da imagem.
          docker volume create fumaca-run
          docker run -d --name fumaca-worker --network fumaca \
            -v fumaca-run:/run/wrapper "${IMAGEM}:${GITHUB_SHA}" worker
          docker run -d --name fumaca-api --network fumaca -p 8080:8080 \
            -e API_TOKEN=fumaca -e ACBR_WORKERS=/run/wrapper/fiscal.sock \
            -v fumaca-run:/run/wrapper "${IMAGEM}:${GITHUB_SHA}"
          # A espera é pelo /readyz, NÃO pelo /healthz. O healthz responde assim
          # que a API abre a porta e não toca no worker, então esperar por ele é
          # esperar por nada: quem depende da lib nativa ter carregado e do
          # socket existir é o readyz. Com a espera no healthz, o readyz era
          # consultado 0,25s depois de subir e devolvia 503 num runner frio.
          pronto=0
          for _ in $(seq 1 60); do
            if curl -fsS localhost:8080/readyz >/dev/null 2>&1; then pronto=1; break; fi
            sleep 2
          done
          if [ "$pronto" != 1 ]; then
            echo "::error::/readyz não ficou pronto em 120s"
            docker logs fumaca-worker || true
            docker logs fumaca-api || true
            exit 1
          fi
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/readyz
          # backend "cgo" nos cinco serviços = a lib nativa realmente carregou.
          docker logs fumaca-worker 2>&1 | grep -c '"backend":"cgo"' | grep -q '^5$' \
            || { echo "::error::a lib nativa não carregou nos 5 serviços"; docker logs fumaca-worker; exit 1; }
          echo "fumaça OK"

      # imagetools copia o manifesto: :latest aponta para o digest que acabou de
      # passar pela fumaça, sem rebuild, como o release faz com :vX.Y.Z.
      - name: promove :<sha> → :latest
        run: |
          set -eu
          docker buildx imagetools create -t "${IMAGEM}:latest" "${IMAGEM}:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGEM}:latest"

      # O deploy hook da Kronn é uma URL cujo UUID é a própria autenticação: vive
      # só no secret, nunca no repositório. Sem ele, este passo não faz nada.
      - name: implanta na Kronn
        env:
          KRONN_DEPLOY_HOOK: ${{ secrets.KRONN_DEPLOY_HOOK }}
        run: |
          set -eu
          if [ -z "${KRONN_DEPLOY_HOOK:-}" ]; then
            echo "::notice::KRONN_DEPLOY_HOOK não configurado: imagem publicada, nada implantado."
            exit 0
          fi
          # Só 202 é sucesso. A Kronn responde 200 quando o auto-deploy está
          # desligado no painel, e isso não pode passar por implantado. 409 é
          # outro deploy em curso: esperar e repetir, senão este commit fica fora
          # da produção sem ninguém saber.
          for tentativa in $(seq 1 10); do
            codigo=$(curl -sS --max-time 30 -o /tmp/kronn.json -w '%{http_code}' \
                       -X POST "$KRONN_DEPLOY_HOOK" || echo 000)
            case "$codigo" in
              202)
                echo "deploy enfileirado na Kronn"; cat /tmp/kronn.json; echo
                exit 0 ;;
              409)
                echo "deploy anterior ainda em curso (tentativa $tentativa de 10); de novo em 30s"
                sleep 30 ;;
              *)
                echo "::error::a Kronn respondeu HTTP $codigo"; cat /tmp/kronn.json 2>/dev/null || true
                exit 1 ;;
            esac
          done
          echo "::error::a Kronn seguiu ocupada por 5 minutos; reimplante pelo painel"
          exit 1
